name: Deploy

# Deploys to Firebase on every push to main (and on demand) when the repository secret
# FIREBASE_SERVICE_ACCOUNT (a service account key JSON, see scripts/setup.sh / docs/NATIVE.md) is set,
# then builds the Android APK against that project and attaches it to a GitHub Release.
#
# Optional: variable FIREBASE_PROJECT_ID (defaults to the key's project), variable VITE_PUBLIC_URL
# (defaults to https://<project>.web.app), variable FUNCTIONS_ENV (the non-secret lines of
# functions/.env.<project> that switch on the optional integrations; scripts/setup.sh can set it), secrets
# ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD for a
# release-signed APK (otherwise the debug-signed APK is attached).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Check configuration
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$SA" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::FIREBASE_SERVICE_ACCOUNT is not set; skipping deploy."
          fi

  deploy:
    name: Deploy to Firebase
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      project: ${{ steps.project.outputs.project }}
      firebase_config: ${{ steps.config.outputs.firebase_config }}
      public_url: ${{ steps.config.outputs.public_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
            web/package-lock.json

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Resolve project
        id: project
        env:
          VAR_PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
          KEY_PROJECT: ${{ steps.auth.outputs.project_id }}
        run: |
          PROJECT="${VAR_PROJECT:-$KEY_PROJECT}"
          if [ -z "$PROJECT" ]; then echo "::error::Set the FIREBASE_PROJECT_ID repository variable."; exit 1; fi
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix functions ci
          npm --prefix web ci

      - name: Web app config
        id: config
        env:
          PROJECT: ${{ steps.project.outputs.project }}
          VAR_PUBLIC_URL: ${{ vars.VITE_PUBLIC_URL }}
        run: |
          APP_ID="$(npx firebase apps:list WEB --project "$PROJECT" --json | node -e '
            let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s.slice(s.indexOf("{"))).result||[];process.stdout.write(r[0]?r[0].appId:"")})')"
          if [ -z "$APP_ID" ]; then echo "::error::No Firebase web app in $PROJECT (run scripts/setup.sh)."; exit 1; fi
          CONFIG="$(npx firebase apps:sdkconfig WEB "$APP_ID" --project "$PROJECT" --json | node scripts/sdkconfig.mjs)"
          PUBLIC_URL="${VAR_PUBLIC_URL:-https://$PROJECT.web.app}"
          echo "firebase_config=$CONFIG" >> "$GITHUB_OUTPUT"
          echo "public_url=$PUBLIC_URL" >> "$GITHUB_OUTPUT"
          echo "VITE_FIREBASE_CONFIG=$CONFIG" >> "$GITHUB_ENV"
          echo "VITE_PUBLIC_URL=$PUBLIC_URL" >> "$GITHUB_ENV"

      - name: Functions settings
        env:
          PROJECT: ${{ steps.project.outputs.project }}
          FUNCTIONS_ENV: ${{ vars.FUNCTIONS_ENV }}
          VAR_PUBLIC_URL: ${{ vars.VITE_PUBLIC_URL }}
        run: |
          # functions/.env.<project> is git-ignored; without it the optional integrations deploy switched off.
          FILE="functions/.env.$PROJECT"
          if [ -n "$FUNCTIONS_ENV" ]; then printf '%s\n' "$FUNCTIONS_ENV" > "$FILE"; fi
          if [ -n "$VAR_PUBLIC_URL" ] && ! grep -qs '^PUBLIC_URL=' "$FILE"; then echo "PUBLIC_URL=$VAR_PUBLIC_URL" >> "$FILE"; fi
          if [ -f "$FILE" ]; then echo "Settings: $(cut -d= -f1 "$FILE" | grep -v '^#' | tr '\n' ' ')"; else echo "No FUNCTIONS_ENV: optional integrations stay off."; fi

      - name: Build and deploy
        run: scripts/deploy.sh --project "${{ steps.project.outputs.project }}" --skip-install

  android-release:
    name: Android release APK
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      VITE_FIREBASE_CONFIG: ${{ needs.deploy.outputs.firebase_config }}
      VITE_PUBLIC_URL: ${{ needs.deploy.outputs.public_url }}
      READLATER_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "READLATER_KEYSTORE=$RUNNER_TEMP/release.jks"
              echo "READLATER_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "READLATER_KEY_ALIAS=$KEY_ALIAS"
              echo "READLATER_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } >> "$GITHUB_ENV"
            echo "Signing with the release keystore."
          else
            # A debug build is debuggable and signed with the key committed to this repository: anyone could sign
            # an "update" that replaces it. Never publish one; CI still uploads it as a workflow artifact for testing.
            echo "::notice title=Android release skipped::Set the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS secrets to publish a release-signed APK (docs/NATIVE.md)."
          fi

      - name: Build APK
        if: env.READLATER_KEYSTORE != ''
        run: |
          echo "sdk.dir=$ANDROID_HOME" > web/android/local.properties
          scripts/build-android.sh --release-only
          cp web/android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/readlater-$READLATER_VERSION_NAME.apk"

      - uses: softprops/action-gh-release@v2
        if: env.READLATER_KEYSTORE != ''
        with:
          tag_name: build-${{ github.run_number }}
          name: Readlater ${{ env.READLATER_VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          body: |
            Android app for ${{ needs.deploy.outputs.public_url }} (commit ${{ github.sha }}).
            Install: download the APK on the device (or `adb install -r`), see docs/NATIVE.md.
          files: ${{ runner.temp }}/readlater-${{ env.READLATER_VERSION_NAME }}.apk
          fail_on_unmatched_files: true
